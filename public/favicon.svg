<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9B5FE0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond arrondi sombre -->
  <rect width="64" height="64" rx="10" fill="#1a1825"/>

  <!-- Bobine gauche (petit cercle) -->
  <circle cx="11" cy="18" r="4" fill="none" stroke="url(#g)" stroke-width="1.6" filter="url(#glow)"/>
  <!-- Bobine droite (grand cercle) -->
  <circle cx="22" cy="16.5" r="5.5" fill="none" stroke="url(#g)" stroke-width="1.6" filter="url(#glow)"/>

  <!-- Corps caméra -->
  <rect x="4" y="22" width="31" height="22" rx="4" fill="none" stroke="url(#g)" stroke-width="1.8" filter="url(#glow)"/>

  <!-- Crochet coin intérieur -->
  <path d="M8 27 L8 31.5 L12.5 31.5" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Triangle viewfinder -->
  <path d="M36 26 L36 40 L47 33 Z" fill="none" stroke="url(#g)" stroke-width="1.6" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- D-K -->
  <text x="49" y="34" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="13" fill="url(#g)" filter="url(#glow)" text-anchor="middle" dominant-baseline="middle">DK</text>

  <!-- PRODUCTION -->
  <text x="32" y="52" font-family="Arial, sans-serif" font-weight="700" font-size="5.5" fill="url(#g)" filter="url(#glow)" text-anchor="middle" letter-spacing="1.5">PRODUCTION</text>
</svg>